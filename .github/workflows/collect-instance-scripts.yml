name: Collect dungeon and raid reference scripts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-instance-scripts.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research tools compile
        run: python -m py_compile tools/collect_coa_instance_scripts.py tools/index_instance_scripts.py tools/build_encounter_database.py tools/publish_encounter_coverage.py
      - name: Validate classifier regexes before downloading
        run: python -c "import tools.build_encounter_database as m; print(m.CREATURE_AI.pattern, m.BOSS_AI.pattern, m.TRASH_AI.pattern)"
      - name: Collect six source repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/collect_coa_instance_scripts.py --priority-only --include-sql --output CoA-All-Instance-Scripts.zip
      - name: Index encounter script symbols
        run: python tools/index_instance_scripts.py CoA-All-Instance-Scripts.zip --output instance-script-symbol-index.json
      - name: Build per-instance DBM encounter research
        run: python tools/build_encounter_database.py CoA-All-Instance-Scripts.zip --output dbm-priority-encounters.json
      - name: Validate archive and coverage
        run: |
          python - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('CoA-All-Instance-Scripts.zip') as z:
              assert z.testzip() is None, 'Corrupt ZIP entry'
              m=json.loads(z.read('manifest.json'))
              assert m['files'], 'Empty archive'
              assert any(s.get('repository')=='Conquest-of-AzerothCore/azerothcore-wotlk-coa' and s.get('status')=='collected' for s in m['sources']), 'Primary CoA source unavailable'
          assert any(s.get('repository')=='Lennix/scriptdev0' and s.get('status')=='collected' for s in m['sources']), 'ScriptDev2 supplemental source unavailable'
          d=json.load(open('dbm-priority-encounters.json'))
          assert len(d['instances'])==22, 'Wrong priority scope'
          assert d.get('cross_instance_sources'), 'Missing global CoA boss references'
          kit_rows=[row for source in d['cross_instance_sources'] for row in source.get('boss_kit_rows_candidate',[])]
          assert len(kit_rows)>=64, f'Incomplete global boss-kit extraction: {len(kit_rows)} rows'
          assert all({'target_type','cast_flags','base_points','comment_candidate'} <= row.keys() for row in kit_rows), 'Incomplete boss-kit row fields'
          mutanus=[f for f in d['instances']['wailing-caverns']['source_files'] if f['repository']=='Lennix/scriptdev0' and 'boss_mutanus_the_devourer' in f['path']]
          jammalan=[f for f in d['instances']['sunken-temple']['source_files'] if f['repository']=='Lennix/scriptdev0' and 'boss_jammalan_ogom' in f['path']]
          assert mutanus and 7967 in mutanus[0]['spell_ids_candidate'] and mutanus[0]['timer_expression_candidates'], 'Incomplete Mutanus source extraction'
          assert jammalan and 12468 in jammalan[0]['spell_ids_candidate'] and jammalan[0]['timer_expression_candidates'], 'Incomplete Jammalan/Ogom source extraction'
          print('Verified archive integrity and',len(m['files']),'source entries across',len(d['instances']),'instances')
          print('Verified',len(kit_rows),'complete global boss-kit candidate rows')
          PY
      - name: Publish per-instance research and coverage report
        run: python tools/publish_encounter_coverage.py dbm-priority-encounters.json
      - name: Extract source inventory
        run: |
          mkdir -p datasets/instance-scripts
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('CoA-All-Instance-Scripts.zip') as z:
              m = json.loads(z.read('manifest.json'))
          with open('datasets/instance-scripts/source-inventory.json','w') as f:
              json.dump({'schema':m['schema'], 'sources':m['sources'], 'files':m['files'], 'notes':m['notes']},f,indent=2)
              f.write('\n')
          print('Indexed',len(m['files']),'source files')
          PY
      - name: Commit searchable source inventory
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/instance-scripts/source-inventory.json datasets/instance-scripts/priority
          if ! git diff --cached --quiet; then
            git commit -m "data: index seven-source dungeon and raid script collection"
            git pull --rebase origin main || { git rebase --abort || true; echo 'Concurrent update: archive and artifact publication will continue'; exit 0; }
            git push origin HEAD:main || echo "Concurrent main update: preserving archive and release outputs instead of failing job"
          fi
      - name: Create permanent source archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create coa-priority-encounters-${{ github.run_id }} CoA-All-Instance-Scripts.zip dbm-priority-encounters.json datasets/instance-scripts/priority/coverage-report.json --title "CoA priority dungeons + ZG research" --notes "Added complete global CoA dungeon boss-kit rows and supplemental ScriptDev2 boss references for Mutanus, Jammal'an, and Ogom. The remaining unresolved Charlga boss-AI reference and other coverage gaps are documented in research/priority-dungeon-source-coverage-gap-analysis-2026-11-02.md. Candidate public-source mechanics only; no live Conquest Reborn verification. Source revisions in manifest.json." --latest=false --target "${{ github.sha }}" || echo "Release upload unavailable; workflow artifact remains the fallback."
      - uses: actions/upload-artifact@v4
        with:
          name: CoA-All-Instance-Scripts
          path: |
            CoA-All-Instance-Scripts.zip
            instance-script-symbol-index.json
            dbm-priority-encounters.json
            datasets/instance-scripts/priority/coverage-report.json
          retention-days: 30
          compression-level: 0
